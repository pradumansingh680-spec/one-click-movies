  background:#151515;

}

}

.search{
  margin-top:15px;
  width:90%;
  max-width:500px;
  padding:13px;
  border-radius:25px;
  border:1px solid #444;
  background:#222;
  color:white;

}

.container{
  padding:20px;
}

h2{
  margin-bottom:15px;
}

.movies{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.movie{

  box-shadow:0 4px 12px #000;
}

.movie img{
  width:100%;
  height:230px;
  object-fit:cover;
}

.movie-info{
  padding:12px;
