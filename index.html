<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Click Movies</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  background:#151515;
  padding:18px;
  text-align:center;
  border-bottom:1px solid #333;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#ff3b30;
}

.search{
  margin-top:15px;
  width:90%;
  max-width:500px;
  padding:13px;
  border-radius:25px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}

.container{
  padding:20px;
}

h2{
  margin-bottom:15px;
}

.movies{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.movie{
  background:#171717;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 12px #000;
}

.movie img{
  width:100%;
  height:230px;
  object-fit:cover;
}

.movie-info{
  padding:12px;
}

.movie-title{
  font-size:16px;
  font-weight:bold;
}

.movie-year{
  color:#aaa;
  margin-top:5px;
  font-size:13px;
}

.watch{
  display:block;
  margin-top:10px;
  padding:9px;
  text-align:center;
  background:#e50914;
  color:white;
  text-decoration:none;
  border-radius:5px;
}

footer{
  margin-top:30px;
  padding:20px;
  text-align:center;
  color:#888;
  border-top:1px solid #333;
}

@media(min-width:700px){
  .movies{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 ONE CLICK MOVIES</div>
  <input class="search" type="text" placeholder="Search movies...">
</header>

<div class="container">

<h2>Latest Movies</h2>

<div class="movies">

<div class="movie">
  <img src="https://via.placeholder.com/500x700?text=Movie+1">
  <div class="movie-info">
    <div class="movie-title">Movie Name 1</div>
    <div class="movie-year">2026 • HD</div>
    <a class="watch" href="#">Watch Now</a>
  </div>
</div>

<div class="movie">
  <img src="https://via.placeholder.com/500x700?text=Movie+2">
  <div class="movie-info">
    <div class="movie-title">Movie Name 2</div>
    <div class="movie-year">2026 • HD</div>
    <a class="watch" href="#">Watch Now</a>
  </div>
</div>

<div class="movie">
  <img src="https://via.placeholder.com/500x700?text=Movie+3">
  <div class="movie-info">
    <div class="movie-title">Movie Name 3</div>
    <div class="movie-year">2026 • HD</div>
    <a class="watch" href="#">Watch Now</a>
  </div>
</div>

<div class="movie">
  <img src="https://via.placeholder.com/500x700?text=Movie+4">
  <div class="movie-info">
    <div class="movie-title">Movie Name 4</div>
    <div class="movie-year">2026 • HD</div>
    <a class="watch" href="#">Watch Now</a>
  </div>
</div>

</div>
</div>

<footer>
© 2026 One Click Movies
</footer>

</body>
  </html>
