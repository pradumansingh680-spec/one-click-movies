<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Click Movies</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial;
}

header{
background:#222;
padding:25px;
text-align:center;
}

h1{
color:red;
}

input{
width:90%;
max-width:500px;
padding:14px;
border-radius:25px;
border:0;
font-size:16px;
}

.container{
padding:20px;
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.movie{
background:#222;
border-radius:10px;
overflow:hidden;
padding-bottom:15px;
}

.poster{
height:180px;
background:#500;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
}

.info{
padding:10px;
}

button{
background:red;
color:white;
border:0;
padding:10px 15px;
border-radius:5px;
font-size:15px;
cursor:pointer;
}

#details{
display:none;
padding:25px;
}

video{
width:100%;
max-width:900px;
display:block;
margin:20px auto;
background:black;
border-radius:10px;
}

.back{
background:#555;
margin-bottom:20px;
}

@media(max-width:600px){
.movies{
grid-template-columns:1fr 1fr;
}
}
</style>
</head>

<body>

<header>
<h1>🎬 ONE CLICK MOVIES</h1>
<input id="search" placeholder="Search movies...">
</header>

<div class="container" id="home">

<h2>Latest Movies</h2>

<div class="movies">

<div class="movie">
<div class="poster">🎬</div>
<div class="info">
<h3>My Test Movie</h3>
<p>2026 • HD</p>
<button onclick="openMovie('My Test Movie')">
Watch Now
</button>
</div>
</div>

<div class="movie">
<div class="poster">🍿</div>
<div class="info">
<h3>Movie Name 2</h3>
<p>2026 • HD</p>
<button onclick="openMovie('Movie Name 2')">
Watch Now
</button>
</div>
</div>

<div class="movie">
<div class="poster">🎥</div>
<div class="info">
<h3>Movie Name 3</h3>
<p>2026 • HD</p>
<button onclick="openMovie('Movie Name 3')">
Watch Now
</button>
</div>
</div>

<div class="movie">
<div class="poster">⭐</div>
<div class="info">
<h3>Movie Name 4</h3>
<p>2026 • HD</p>
<button onclick="openMovie('Movie Name 4')">
Watch Now
</button>
</div>
</div>

</div>
</div>

<div id="details">

<button class="back" onclick="goBack()">← Back</button>

<h1 id="movieTitle">My Test Movie</h1>

<p>2026 • HD</p>

<video controls>
<source src="YOUR_VIDEO_URL_HERE" type="video/mp4">
Your browser does not support video playback.
</video>

<h2>Movie Details</h2>
<p>
This is a test movie page for One Click Movies.
</p>

</div>

<script>

function openMovie(name){
document.getElementById("home").style.display="none";
document.getElementById("details").style.display="block";
document.getElementById("movieTitle").innerText=name;
window.scrollTo(0,0);
}

function goBack(){
document.getElementById("details").style.display="none";
document.getElementById("home").style.display="block";
}

document.getElementById("search").addEventListener("input",function(){

let text=this.value.toLowerCase();
let cards=document.querySelectorAll(".movie");

cards.forEach(function(card){

let name=card.querySelector("h3").innerText.toLowerCase();

if(name.includes(text)){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

</script>

</body>
</html>
