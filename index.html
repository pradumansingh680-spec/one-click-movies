<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Click Movies</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
}
header{
  background:#222;
  padding:25px;
  text-align:center;
}
h1{
  color:red;
}
input{
  width:90%;
  max-width:500px;
  padding:14px;
  border-radius:25px;
  border:0;
  font-size:16px;
}
.container{
  padding:20px;
}
.movies{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.movie{
  background:#222;
  border-radius:10px;
  overflow:hidden;
  padding-bottom:15px;
}
.poster{
  height:180px;
  background:#500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}
.info{
  padding:10px;
}
button{
  background:red;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:5px;
}
</style>
</head>

<body>

<header>
<h1>🎬 ONE CLICK MOVIES</h1>
<input id="search" placeholder="Search movies...">
</header>

<div class="container">
<h2>Latest Movies</h2>

<div class="movies">

<div class="movie">
<div class="poster">🎬</div>
<div class="info">
<h3>Movie Name 1</h3>
<p>2026 • HD</p>
<button>Watch Now</button>
</div>
</div>

<div class="movie">
<div class="poster">🍿</div>
<div class="info">
<h3>Movie Name 2</h3>
<p>2026 • HD</p>
<button>Watch Now</button>
</div>
</div>

<div class="movie">
<div class="poster">🎥</div>
<div class="info">
<h3>Movie Name 3</h3>
<p>2026 • HD</p>
<button>Watch Now</button>
</div>
</div>

<div class="movie">
<div class="poster">⭐</div>
<div class="info">
<h3>Movie Name 4</h3>
<p>2026 • HD</p>
<button>Watch Now</button>
</div>
</div>

</div>
</div>

</body>
</html>
